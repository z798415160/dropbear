name: Build Dropbear armv7 musl static (Docker)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Docker
        run: |
          docker build -t dropbear-builder .
          docker run --rm -v "$(pwd)/output:/build/output" dropbear-builder

      - name: Upload dropbear artifact
        uses: actions/upload-artifact@v4
        with:
          name: dropbear-armv7-musl-static
          path: output/dropbear
          retention-days: 7
